333334,29.704080400000002],[120.27038533333332,29.7358924],[120.19460893333333,29.7309844]],"color":"#177e89"},{"name":"诸暨现代环保装备高新技术产业园区","path":[[120.35197691561763,29.92475],[120.34337980849877,29.932452407170384],[120.3350504695525,29.93853936401435],[120.322724,29.943638553087688],[120.31082061771642,29.938066065123994],[120.30132828032069,29.932728314897872],[120.29348756647236,29.92475],[120.30214476714596,29.917076147354372],[120.31034464993142,29.910901479656886],[120.322724,29.90587330776139],[120.33458377283809,29.91148271985175],[120.34421188936584,29.91673731566776]],"color":"#d68120"}],"branches":[{"name":"诸暨店口","pos":[120.345033,29.925863],"sourceDistrict":"诸暨市","address":"华佳路106号","distance":394,"inside":true,"nearestZone":"诸暨现代环保装备高新技术产业园区"},{"name":"诸暨滨江北路","pos":[120.276062,29.724946],"sourceDistrict":"诸暨市","address":"诸暨市","distance":1228,"inside":false,"nearestZone":"浙江诸暨经济开发区"}]};const map=new AMap.Map("map",{center:cfg.center,zoom:11,viewMode:"2D",resizeEnable:true,scrollWheel:true,mapStyle:"amap://styles/normal"});map.addControl(new AMap.Scale());map.addControl(new AMap.ToolBar({position:{right:"18px",top:"88px"}}));const overlays=[],rows=[];document.getElementById("legend").innerHTML="<div><b>"+cfg.city+" · "+cfg.district+"</b></div><div class='section'>开发区（"+cfg.zones.length+"个）</div>"+cfg.zones.map(z=>"<div><span class='sw' style='background:"+z.color+"33;border-color:"+z.color+"'></span>"+z.name+"</div>").join("")+"<div class='section'>网点（"+cfg.branches.length+"个）</div>"+(cfg.branches.length?cfg.branches.map(b=>"<div>"+(b.external?"[同市外区] ":"")+b.name+"</div>").join(""):"<div>同市10公里内无可补充网点</div>")+"<div class='section'>绿色=区内；红色=本区区外；紫色=同市外区且距边界10公里内</div>";function foot(p,a,b){const lat=p.getLat()*Math.PI/180,kx=111320*Math.cos(lat),ky=110540,px=p.getLng()*kx,py=p.getLat()*ky,ax=a.getLng()*kx,ay=a.getLat()*ky,bx=b.getLng()*kx,by=b.getLat()*ky,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));return new AMap.LngLat((ax+t*dx)/kx,(ay+t*dy)/ky)}cfg.zones.forEach(z=>{z.poly=new AMap.Polygon({path:z.path,strokeColor:z.color,strokeWeight:4,fillColor:z.color,fillOpacity:.18,zIndex:40});map.add(z.poly);overlays.push(z.poly);const c=z.poly.getBounds().getCenter();map.add(new AMap.Marker({position:c,content:"<div class='zone-label' style='color:"+z.color+"'>"+z.name+"</div>",offset:new AMap.Pixel(-70,-14),zIndex:70}))});cfg.branches.forEach(b=>{const p=new AMap.LngLat(...b.pos);let insideZone=null,nearZone=null,min=Infinity,nearestPoint=null;for(const z of cfg.zones){const ring=z.poly.getPath();if(AMap.GeometryUtil.isPointInRing(p,ring))insideZone=z;for(let i=0;i<ring.length;i++){const distance=AMap.GeometryUtil.distanceToSegment(p,ring[i],ring[(i+1)%ring.length]);if(distance<min){min=distance;nearZone=z;nearestPoint=foot(p,ring[i],ring[(i+1)%ring.length])}}}const color=b.external?"#7546a8":(insideZone?"#23965b":"#d33b49"),distance=min<1000?Math.round(min)+"米":(min/1000).toFixed(2)+"公里";const marker=new AMap.Marker({position:p,content:"<div class='branch-dot' style='background:"+color+"'></div>",offset:new AMap.Pixel(-14,-14),zIndex:120,title:b.name});map.add(marker);overlays.push(marker);const status=b.external?"<b style='color:#7546a8'>同市外区</b> · 距"+nearZone.name+"边界 "+distance:(insideZone?"<b style='color:#23965b'>区内</b> · "+insideZone.name:"<b style='color:#d33b49'>区外</b> · 距"+nearZone.name+"边界 "+distance);rows.push("<b>"+b.name+"</b><br>"+status);if((b.external||!insideZone)&&nearestPoint){const line=new AMap.Polyline({path:[p,nearestPoint],strokeColor:color,strokeWeight:2,strokeOpacity:.55,strokeStyle:"dashed"});map.add(line);overlays.push(line)}});document.getElementById("result").innerHTML="<b>网点判定详情</b><br><br>"+(rows.join("<br><br>")||"暂无网点");if(overlays.length)map.setFitView(overlays,false,[90,90,90,90],12);</script></body></html>
