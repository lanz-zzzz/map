'section'>开发区（"+cfg.zones.length+"个）</div>"+cfg.zones.map(z=>"<div><span class='sw' style='background:"+z.color+"33;border-color:"+z.color+"'></span>"+z.name+"</div>").join("")+"<div class='section'>网点（"+cfg.branches.length+"个）</div>"+(cfg.branches.length?cfg.branches.map(b=>"<div>"+(b.external?"[同市外区] ":"")+b.name+"</div>").join(""):"<div>同市10公里内无可补充网点</div>")+"<div class='section'>绿色=区内；红色=本区区外；紫色=同市外区且距边界10公里内</div>";function foot(p,a,b){const lat=p.getLat()*Math.PI/180,kx=111320*Math.cos(lat),ky=110540,px=p.getLng()*kx,py=p.getLat()*ky,ax=a.getLng()*kx,ay=a.getLat()*ky,bx=b.getLng()*kx,by=b.getLat()*ky,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));return new AMap.LngLat((ax+t*dx)/kx,(ay+t*dy)/ky)}cfg.zones.forEach(z=>{z.poly=new AMap.Polygon({path:z.path,strokeColor:z.color,strokeWeight:4,fillColor:z.color,fillOpacity:.18,zIndex:40});map.add(z.poly);overlays.push(z.poly);const c=z.poly.getBounds().getCenter();map.add(new AMap.Marker({position:c,content:"<div class='zone-label' style='color:"+z.color+"'>"+z.name+"</div>",offset:new AMap.Pixel(-70,-14),zIndex:70}))});cfg.branches.forEach(b=>{const p=new AMap.LngLat(...b.pos);let insideZone=null,nearZone=null,min=Infinity,nearestPoint=null;for(const z of cfg.zones){const ring=z.poly.getPath();if(AMap.GeometryUtil.isPointInRing(p,ring))insideZone=z;for(let i=0;i<ring.length;i++){const distance=AMap.GeometryUtil.distanceToSegment(p,ring[i],ring[(i+1)%ring.length]);if(distance<min){min=distance;nearZone=z;nearestPoint=foot(p,ring[i],ring[(i+1)%ring.length])}}}const color=b.external?"#7546a8":(insideZone?"#23965b":"#d33b49"),distance=min<1000?Math.round(min)+"米":(min/1000).toFixed(2)+"公里";const marker=new AMap.Marker({position:p,content:"<div class='branch-dot' style='background:"+color+"'></div>",offset:new AMap.Pixel(-14,-14),zIndex:120,title:b.name});map.add(marker);overlays.push(marker);const status=b.external?"<b style='color:#7546a8'>同市外区</b> · 距"+nearZone.name+"边界 "+distance:(insideZone?"<b style='color:#23965b'>区内</b> · "+insideZone.name:"<b style='color:#d33b49'>区外</b> · 距"+nearZone.name+"边界 "+distance);rows.push("<b>"+b.name+"</b><br>"+status);if((b.external||!insideZone)&&nearestPoint){const line=new AMap.Polyline({path:[p,nearestPoint],strokeColor:color,strokeWeight:2,strokeOpacity:.55,strokeStyle:"dashed"});map.add(line);overlays.push(line)}});document.getElementById("result").innerHTML="<b>网点判定详情</b><br><br>"+(rows.join("<br><br>")||"暂无网点");if(overlays.length)map.setFitView(overlays,false,[90,90,90,90],12);</script></body></html>
