<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>义乌市开发区与分支机构位置关系图</title><style>html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}.panel{position:absolute;z-index:300;background:rgba(255,255,255,.88);box-shadow:0 2px 12px rgba(0,0,0,.18);border-radius:8px}.title{left:16px;top:14px;padding:10px 13px;max-width:min(720px,calc(100% - 110px))}.title b{font-size:20px}.title div{font-size:12px;color:#59636d;margin-top:4px}.legend{left:16px;bottom:18px;padding:9px 11px;font-size:13px;max-width:440px;max-height:44%;overflow:auto}.legend div{margin:4px 0}.section{font-weight:700;margin-top:7px;padding-top:6px;border-top:1px solid #d8dde2}.result{right:16px;bottom:18px;padding:10px 12px;max-width:430px;max-height:46%;overflow:auto;font-size:13px;line-height:1.65}.sw{display:inline-block;width:18px;height:10px;margin-right:7px;border:2px solid}.zone-label{padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.88);border:2px solid currentColor;white-space:nowrap;font-weight:700}.branch-dot{width:21px;height:21px;border-radius:50%;border:4px solid white;box-shadow:0 1px 8px rgba(0,0,0,.5)}.amap-logo,.amap-copyright{opacity:.35}</style><script>window._AMapSecurityConfig={securityJsCode:"b6dddc80a44c9abaaf4cc3192d500055"};</script><script src="https://webapi.amap.com/maps?v=2.0&key=2aee1e26eab6b0efa5e9ac000cb40aca&plugin=AMap.GeometryUtil,AMap.Scale,AMap.ToolBar"></script></head><body><div id="map"></div><div class="panel title"><b>义乌市开发区与分支机构位置关系图</b><div>范围依据高德检索参考点近似形成，用于位置关系摸排，不作为法定规划红线。</div></div><div class="panel legend" id="legend"></div><div class="panel result" id="result"></div><script>const cfg={"title":"义乌市开发区与分支机构位置关系图","city":"金华市","district":"义乌市","center":[120.048116,29.278933],"zones":[{"name":"义乌经济技术开发区","path":[[120.0266812,29.293150320000002],[120.04297840000001,29.17065552],[120.0648496,29.29879392],[120.05870320000001,29.30147832],[120.04395760000001,29.30743392]],"color":"#177e89"},{"name":"义乌自由贸易发展区","path":[[120.07600644953294,29.27986],[120.06746414272614,29.287562407170384],[120.05918789726435,29.29364936401435],[120.04694,29.298748553087687],[120.03511249313064,29.293176065123994],[120.02568066248958,29.287838314897872],[120.01788992749573,29.27986],[120.02649194480452,29.272186147354372],[120.03463955929446,29.266011479656886],[120.04694,29.26098330776139],[120.05872417540243,29.26659271985175],[120.06829091968218,29.27184731566776]],"color":"#d68120"}],"branches":[{"name":"义乌江滨西路","pos":[120.065546,29.290967],"sourceDistrict":"义乌市","address":"义乌市","distance":169,"inside":false,"nearestZone":"义乌自由贸易发展区"}]};const map=new AMap.Map("map",{center:cfg.center,zoom:11,viewMode:"2D",resizeEnable:true,scrollWheel:true,mapStyle:"amap://styles/normal"});map.addControl(new AMap.Scale());map.addControl(new AMap.ToolBar({position:{right:"18px",top:"88px"}}));const overlays=[],rows=[];document.getElementById("legend").innerHTML="<div><b>"+cfg.city+" · "+cfg.district+"</b></div><div class='section'>开发区（"+cfg.zones.length+"个）</div>"+cfg.zones.map(z=>"<div><span class='sw' style='background:"+z.color+"33;border-color:"+z.color+"'></span>"+z.name+"</div>").join("")+"<div class='section'>网点（"+cfg.branches.length+"个）</div>"+(cfg.branches.length?cfg.branches.map(b=>"<div>"+(b.external?"[同市外区] ":"")+b.name+"</div>").join(""):"<div>同市10公里内无可补充网点</div>")+"<div class='section'>绿色=区内；红色=本区区外；紫色=同市外区且距边界10公里内</div>";function foot(p,a,b){const lat=p.getLat()*Math.PI/180,kx=111320*Math.cos(lat),ky=110540,px=p.getLng()*kx,py=p.getLat()*ky,ax=a.getLng()*kx,ay=a.getLat()*ky,bx=b.getLng()*kx,by=b.getLat()*ky,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));return new AMap.LngLat((ax+t*dx)/kx,(ay+t*dy)/ky)}cfg.zones.forEach(z=>{z.poly=new AMap.Polygon({path:z.path,strokeColor:z.color,strokeWeight:4,fillColor:z.color,fillOpacity:.18,zIndex:40});map.add(z.poly);overlays.push(z.poly);const c=z.poly.getBounds().getCenter();map.add(new AMap.Marker({position:c,content:"<div class='zone-label' style='color:"+z.color+"'>"+z.name+"</div>",offset:new AMap.Pixel(-70,-14),zIndex:70}))});cfg.branches.forEach(b=>{const p=new AMap.LngLat(...b.pos);let insideZone=null,nearZone=null,min=Infinity,nearestPoint=null;for(const z of cfg.zones){const ring=z.poly.getPath();if(AMap.GeometryUtil.isPointInRing(p,ring))insideZone=z;for(let i=0;i<ring.length;i++){const distance=AMap.GeometryUtil.distanceToSegment(p,ring[i],ring[(i+1)%ring.length]);if(distance<min){min=distance;nearZone=z;nearestPoint=foot(p,ring[i],ring[(i+1)%ring.length])}}}const color=b.external?"#7546a8":(insideZone?"#23965b":"#d33b49"),distance=min<1000?Math.round(min)+"米":(min/1000).toFixed(2)+"公里";const marker=new AMap.Marker({position:p,content:"<div class='branch-dot' style='background:"+color+"'></div>",offset:new AMap.Pixel(-14,-14),zIndex:120,title:b.name});map.add(marker);overlays.push(marker);const status=b.external?"<b style='color:#7546a8'>同市外区</b> · 距"+nearZone.name+"边界 "+distance:(insideZone?"<b style='color:#23965b'>区内</b> · "+insideZone.name:"<b style='color:#d33b49'>区外</b> · 距"+nearZone.name+"边界 "+distance);rows.push("<b>"+b.name+"</b><br>"+status);if((b.external||!insideZone)&&nearestPoint){const line=new AMap.Polyline({path:[p,nearestPoint],strokeColor:color,strokeWeight:2,strokeOpacity:.55,strokeStyle:"dashed"});map.add(line);overlays.push(line)}});document.getElementById("result").innerHTML="<b>网点判定详情</b><br><br>"+(rows.join("<br><br>")||"暂无网点");if(overlays.length)map.setFitView(overlays,false,[90,90,90,90],12);</script></body></html>
