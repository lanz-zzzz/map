<title>乐清市开发区与分支机构位置关系图</title>
<style>html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}.panel{position:absolute;z-index:300;background:rgba(255,255,255,.90);box-shadow:0 2px 12px rgba(0,0,0,.18);border-radius:8px}.title{left:16px;top:14px;padding:10px 13px;max-width:min(720px,calc(100% - 110px))}.title b{font-size:20px}.title div{font-size:12px;color:#59636d;margin-top:4px;line-height:1.5}.title a{color:#126b82}.legend{left:16px;bottom:18px;padding:9px 11px;font-size:13px;max-width:410px;max-height:46%;overflow:auto}.legend div{margin:4px 0}.legend .section{font-weight:700;margin-top:7px;padding-top:6px;border-top:1px solid #d8dde2}.legend .section:first-child{margin-top:0;padding-top:0;border-top:0}.legend .sub{padding-left:25px;color:#4f5b66}.sw{display:inline-block;width:18px;height:10px;margin-right:7px;vertical-align:middle;border:2px solid}.result{right:16px;bottom:18px;padding:10px 12px;max-width:380px;max-height:46%;overflow:auto;font-size:13px;line-height:1.65}.result .heading{font-weight:700;margin-bottom:6px}.zone-label{padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.90);border:2px solid currentColor;white-space:nowrap;font-weight:700}.branch-dot{width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 1px 7px rgba(0,0,0,.45)}.amap-logo,.amap-copyright{opacity:.45}</style>
<script>window._AMapSecurityConfig={securityJsCode:"b6dddc80a44c9abaaf4cc3192d500055"};</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=2aee1e26eab6b0efa5e9ac000cb40aca&plugin=AMap.GeometryUtil,AMap.Scale,AMap.ToolBar"></script></head><body>
<div id="map"></div><div class="panel title"><b>乐清市开发区与分支机构位置关系图</b><div>依据浙江省经济信息中心开发区资料及地图现状近似落图；未公开法定拐点坐标的片区采用不规则示意边界，不作为法定规划红线。 <a href="https://zjic.zj.gov.cn/ywdh/ggkf/202211/t20221110_7451437.shtml" target="_blank">依据来源</a></div></div>
<div class="panel legend" id="legend"></div><div class="panel result" id="result"></div>
<script>
const cfg={"file":"03-温州市-乐清市-开发区与分支机构位置关系图.html","title":"乐清市开发区与分支机构位置关系图","center":[120.939414,28.083459],"zoom":11,"source":"https://zjic.zj.gov.cn/ywdh/ggkf/202211/t20221110_7451437.shtml","note":"依据浙江省经济信息中心开发区资料及地图现状近似落图；未公开法定拐点坐标的片区采用不规则示意边界，不作为法定规划红线。","zones":[{"name":"浙江乐清经济开发区","path":[[120.886312,28.036538],[120.890184,28.034954],[120.896392,28.03457],[120.900744,28.037018],[120.901512,28.041674],[120.899464,28.04597],[120.895432,28.046378],[120.889384,28.045994],[120.885512,28.04297],[120.885864,28.038938]],"color":"#177e89"},{"name":"乐清湾临港经济开发区虹桥镇东区块","path":[[120.651592,27.966473],[120.677304,27.962096],[120.716386,27.960239],[120.745183,27.9678],[120.749297,27.980667],[120.736955,27.991744],[120.710215,27.993667],[120.672162,27.992606],[120.64645,27.983453],[120.649535,27.973106]],"color":"#d68120"},{"name":"乐清湾港区","path":[[121.069649,28.151524],[121.077059,28.148504],[121.087743,28.147885],[121.096015,28.152298],[121.096934,28.159343],[121.093717,28.166272],[121.08602,28.167395],[121.075623,28.166311],[121.068213,28.161434],[121.069304,28.155395]],"color":"#6b5ca5"},{"name":"乐清湾临港经济开发区石帆天成区块","path":[[121.075008,28.150615],[121.07903,28.148487],[121.085478,28.147971],[121.089998,28.15126],[121.090796,28.157516],[121.088669,28.163289],[121.084481,28.163837],[121.078199,28.163321],[121.074177,28.159258],[121.074543,28.15384]],"color":"#2e8b68"}],"branches":[{"name":"乐清旭阳路证券营业部","pos":[120.989451,28.109205],"distance":9159,"inside":false,"nearestZone":"乐清湾港区"}]};
const map=new AMap.Map('map',{center:cfg.center,zoom:cfg.zoom,viewMode:'2D',resizeEnable:true,scrollWheel:true,mapStyle:'amap://styles/normal'});
map.addControl(new AMap.Scale());map.addControl(new AMap.ToolBar({position:{right:'18px',top:'88px'}}));
const overlays=[];document.getElementById('legend').innerHTML='<div class="section">开发区片区：'+cfg.zones.length+'个</div>'+cfg.zones.map((z,i)=>'<div><span class="sw" style="background:'+z.color+'33;border-color:'+z.color+'"></span>'+(i+1)+'. '+z.name+'</div>').join('')+'<div class="section">图上网点：'+cfg.branches.length+'个</div>'+(cfg.branches.length?cfg.branches.map((b,i)=>'<div class="sub" style="color:'+(b.external?'#7546a8':'#4f5b66')+'">'+(i+1)+'. '+(b.external?'[同市外区] ':'')+b.name+'</div>').join(''):'<div class="sub">同市10公里内无可补充网点</div>')+'<div class="section">状态说明</div><div>● <span style="color:#23965b">绿色：本区且区内</span></div><div>● <span style="color:#d33b49">红色：本区但区外</span></div><div>● <span style="color:#7546a8">紫色：同市其他区县网点（10公里内）</span></div>';
function nearestPoint(p,a,b){const lat0=p.getLat()*Math.PI/180,kx=111320*Math.cos(lat0),ky=110540,px=p.getLng()*kx,py=p.getLat()*ky,ax=a.getLng()*kx,ay=a.getLat()*ky,bx=b.getLng()*kx,by=b.getLat()*ky,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));return new AMap.LngLat((ax+t*dx)/kx,(ay+t*dy)/ky)}
cfg.zones.forEach(z=>{z.poly=new AMap.Polygon({path:z.path,strokeColor:z.color,strokeWeight:4,fillColor:z.color,fillOpacity:.18,zIndex:40});map.add(z.poly);overlays.push(z.poly);const c=z.poly.getBounds().getCenter();map.add(new AMap.Marker({position:c,content:'<div class="zone-label" style="color:'+z.color+'">'+z.name+'</div>',offset:new AMap.Pixel(-55,-14),zIndex:70}));});
const rows=[];
cfg.branches.forEach(b=>{const p=new AMap.LngLat(...b.pos);let inside=null,nearestZone=null,foot=null,min=Infinity;for(const z of cfg.zones){const ring=z.poly.getPath();if(AMap.GeometryUtil.isPointInRing(p,ring))inside=z;for(let i=0;i<ring.length;i++){const d=AMap.GeometryUtil.distanceToSegment(p,ring[i],ring[(i+1)%ring.length]);if(d<min){min=d;nearestZone=z;foot=nearestPoint(p,ring[i],ring[(i+1)%ring.length]);}}}const external=Boolean(b.external),color=external?'#7546a8':(inside?'#23965b':'#d33b49');const marker=new AMap.Marker({position:p,content:'<div class="branch-dot" style="background:'+color+'"></div>',offset:new AMap.Pixel(-12,-12),zIndex:120,title:b.name});map.add(marker);overlays.push(marker);const dist=min<1000?Math.round(min)+'米':(min/1000).toFixed(2)+'公里';let status;if(external){status='<b style="color:#7546a8">同市外区网点（'+b.sourceDistrict+'）</b> · '+(inside?'落在'+inside.name+'示意范围内，距边界 '+dist:'距'+nearestZone.name+'最近边界 '+dist);}else if(inside){status='<b style="color:#23965b">区内</b> · '+inside.name;}else{status='<b style="color:#d33b49">区外</b> · 距'+nearestZone.name+'最近边界 '+dist;}rows.push('<b>'+b.name+'</b><br>'+status);const info=new AMap.InfoWindow({content:'<div style="padding:5px 8px"><b>'+b.name+'</b><br>'+status+'</div>',offset:new AMap.Pixel(0,-18)});marker.on('click',()=>info.open(map,p));if((external||!inside)&&foot){const lineColor=external?'#9b7abb':'#cf8c94';const line=new AMap.Polyline({path:[p,foot],strokeColor:lineColor,strokeWeight:2,strokeOpacity:.65,strokeStyle:'dashed',zIndex:75});map.add(line);overlays.push(line);map.add(new AMap.CircleMarker({center:foot,radius:4,strokeColor:color,strokeWeight:2,fillColor:'#fff',fillOpacity:1,zIndex:100}));const mid=[(p.getLng()+foot.getLng())/2,(p.getLat()+foot.getLat())/2];map.add(new AMap.Marker({position:mid,content:'<div class="zone-label" style="color:'+color+'">'+dist+'</div>',offset:new AMap.Pixel(-35,-13),zIndex:105}));}});
document.getElementById('result').innerHTML='<div class="heading">网点判定详情（'+cfg.branches.length+'个，其中紫色为同市外区补充）</div>'+(rows.length?rows.join('<hr style="border:0;border-top:1px solid #ddd">'):'暂无对应分支机构');map.setFitView(overlays,false,[90,80,80,80],14);
</script></body></html>
