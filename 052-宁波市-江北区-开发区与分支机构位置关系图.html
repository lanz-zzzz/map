<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>江北区开发区与分支机构位置关系图</title><style>html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}.panel{position:absolute;z-index:300;background:rgba(255,255,255,.88);box-shadow:0 2px 12px rgba(0,0,0,.18);border-radius:8px}.title{left:16px;top:14px;padding:10px 13px;max-width:min(720px,calc(100% - 110px))}.title b{font-size:20px}.title div{font-size:12px;color:#59636d;margin-top:4px}.legend{left:16px;bottom:18px;padding:9px 11px;font-size:13px;max-width:440px;max-height:44%;overflow:auto}.legend div{margin:4px 0}.section{font-weight:700;margin-top:7px;padding-top:6px;border-top:1px solid #d8dde2}.result{right:16px;bottom:18px;padding:10px 12px;max-width:430px;max-height:46%;overflow:auto;font-size:13px;line-height:1.65}.sw{display:inline-block;width:18px;height:10px;margin-right:7px;border:2px solid}.zone-label{padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.88);border:2px solid currentColor;white-space:nowrap;font-weight:700}.branch-dot{width:21px;height:21px;border-radius:50%;border:4px solid white;box-shadow:0 1px 8px rgba(0,0,0,.5)}.amap-logo,.amap-copyright{opacity:.35}</style><script>window._AMapSecurityConfig={securityJsCode:"b6dddc80a44c9abaaf4cc3192d500055"};</script><script src="https://webapi.amap.com/maps?v=2.0&key=2aee1e26eab6b0efa5e9ac000cb40aca&plugin=AMap.GeometryUtil,AMap.Scale,AMap.ToolBar"></script></head><body><div id="map"></div><div class="panel title"><b>江北区开发区与分支机构位置关系图</b><div>范围依据高德检索参考点近似形成，用于位置关系摸排，不作为法定规划红线。</div></div><div class="panel legend" id="legend"></div><div class="panel result" id="result"></div><script>const cfg={"title":"江北区开发区与分支机构位置关系图","city":"宁波市","district":"江北区","center":[121.4269,29.976391],"zones":[{"name":"浙江前洋经济开发区","path":[[121.43739553333334,29.944255599999998],[121.47657313333333,29.9455372],[121.46653633333334,29.9457892]],"color":"#177e89"},{"name":"宁波江北光电新材料高新技术产业园区","path":[[121.43621930732746,29.990626],[121.42761650120039,29.998328407170384],[121.41928164074898,30.00441536401435],[121.406947,30.009514553087687],[121.39503572698382,30.003942065123994],[121.38553709713318,29.99860431489787],[121.37769118568849,29.990626],[121.38635412520622,29.98295214735437],[121.39455944368055,29.976777479656885],[121.406947,29.97174930776139],[121.41881463466208,29.97735871985175],[121.4284491336525,29.98261331566776]],"color":"#d68120"}],"branches":[{"name":"宁波环城北路","pos":[121.566435,29.899169],"sourceDistrict":"江北区","address":"江北区","distance":10073,"inside":false,"nearestZone":"浙江前洋经济开发区"}]};const map=new AMap.Map("map",{center:cfg.center,zoom:11,viewMode:"2D",resizeEnable:true,scrollWheel:true,mapStyle:"amap://styles/normal"});map.addControl(new AMap.Scale());map.addControl(new AMap.ToolBar({position:{right:"18px",top:"88px"}}));const overlays=[],rows=[];document.getElementById("legend").innerHTML="<div><b>"+cfg.city+" · "+cfg.district+"</b></div><div class='section'>开发区（"+cfg.zones.length+"个）</div>"+cfg.zones.map(z=>"<div><span class='sw' style='background:"+z.color+"33;border-color:"+z.color+"'></span>"+z.name+"</div>").join("")+"<div class='section'>网点（"+cfg.branches.length+"个）</div>"+(cfg.branches.length?cfg.branches.map(b=>"<div>"+(b.external?"[同市外区] ":"")+b.name+"</div>").join(""):"<div>同市10公里内无可补充网点</div>")+"<div class='section'>绿色=区内；红色=本区区外；紫色=同市外区且距边界10公里内</div>";function foot(p,a,b){const lat=p.getLat()*Math.PI/180,kx=111320*Math.cos(lat),ky=110540,px=p.getLng()*kx,py=p.getLat()*ky,ax=a.getLng()*kx,ay=a.getLat()*ky,bx=b.getLng()*kx,by=b.getLat()*ky,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));return new AMap.LngLat((ax+t*dx)/kx,(ay+t*dy)/ky)}cfg.zones.forEach(z=>{z.poly=new AMap.Polygon({path:z.path,strokeColor:z.color,strokeWeight:4,fillColor:z.color,fillOpacity:.18,zIndex:40});map.add(z.poly);overlays.push(z.poly);const c=z.poly.getBounds().getCenter();map.add(new AMap.Marker({position:c,content:"<div class='zone-label' style='color:"+z.color+"'>"+z.name+"</div>",offset:new AMap.Pixel(-70,-14),zIndex:70}))});cfg.branches.forEach(b=>{const p=new AMap.LngLat(...b.pos);let insideZone=null,nearZone=null,min=Infinity,nearestPoint=null;for(const z of cfg.zones){const ring=z.poly.getPath();if(AMap.GeometryUtil.isPointInRing(p,ring))insideZone=z;for(let i=0;i<ring.length;i++){const distance=AMap.GeometryUtil.distanceToSegment(p,ring[i],ring[(i+1)%ring.length]);if(distance<min){min=distance;nearZone=z;nearestPoint=foot(p,ring[i],ring[(i+1)%ring.length])}}}const color=b.external?"#7546a8":(insideZone?"#23965b":"#d33b49"),distance=min<1000?Math.round(min)+"米":(min/1000).toFixed(2)+"公里";const marker=new AMap.Marker({position:p,content:"<div class='branch-dot' style='background:"+color+"'></div>",offset:new AMap.Pixel(-14,-14),zIndex:120,title:b.name});map.add(marker);overlays.push(marker);const status=b.external?"<b style='color:#7546a8'>同市外区</b> · 距"+nearZone.name+"边界 "+distance:(insideZone?"<b style='color:#23965b'>区内</b> · "+insideZone.name:"<b style='color:#d33b49'>区外</b> · 距"+nearZone.name+"边界 "+distance);rows.push("<b>"+b.name+"</b><br>"+status);if((b.external||!insideZone)&&nearestPoint){const line=new AMap.Polyline({path:[p,nearestPoint],strokeColor:color,strokeWeight:2,strokeOpacity:.55,strokeStyle:"dashed"});map.add(line);overlays.push(line)}});document.getElementById("result").innerHTML="<b>网点判定详情</b><br><br>"+(rows.join("<br><br>")||"暂无网点");if(overlays.length)map.setFitView(overlays,false,[90,90,90,90],12);</script></body></html>
