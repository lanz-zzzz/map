<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>东阳市开发区与分支机构位置关系图</title><style>html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}.panel{position:absolute;z-index:300;background:rgba(255,255,255,.88);box-shadow:0 2px 12px rgba(0,0,0,.18);border-radius:8px}.title{left:16px;top:14px;padding:10px 13px;max-width:min(720px,calc(100% - 110px))}.title b{font-size:20px}.title div{font-size:12px;color:#59636d;margin-top:4px}.legend{left:16px;bottom:18px;padding:9px 11px;font-size:13px;max-width:440px;max-height:44%;overflow:auto}.legend div{margin:4px 0}.section{font-weight:700;margin-top:7px;padding-top:6px;border-top:1px solid #d8dde2}.result{right:16px;bottom:18px;padding:10px 12px;max-width:430px;max-height:46%;overflow:auto;font-size:13px;line-height:1.65}.sw{display:inline-block;width:18px;height:10px;margin-right:7px;border:2px solid}.zone-label{padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.88);border:2px solid currentColor;white-space:nowrap;font-weight:700}.branch-dot{width:21px;height:21px;border-radius:50%;border:4px solid white;box-shadow:0 1px 8px rgba(0,0,0,.5)}.amap-logo,.amap-copyright{opacity:.35}</style><script>window._AMapSecurityConfig={securityJsCode:"b6dddc80a44c9abaaf4cc3192d500055"};</script><script src="https://webapi.amap.com/maps?v=2.0&key=2aee1e26eab6b0efa5e9ac000cb40aca&plugin=AMap.GeometryUtil,AMap.Scale,AMap.ToolBar"></script></head><body><div id="map"></div><div class="panel title"><b>东阳市开发区与分支机构位置关系图</b><div>范围依据高德检索参考点近似形成，用于位置关系摸排，不作为法定规划红线。</div></div><div class="panel legend" id="legend"></div><div class="panel result" id="result"></div><script>const cfg={"title":"东阳市开发区与分支机构位置关系图","city":"金华市","district":"东阳市","center":[120.29044,29.202693],"zones":[{"name":"浙江东阳经济开发区","path":[[120.20728596,29.268943319999998],[120.33815315999999,29.29437612],[120.34737995999998,29.30982972],[120.34733195999999,29.30998812],[120.31209996,29.317869719999997]],"color":"#177e89"},{"name":"横店影视文化产业集聚区","path":[[120.31665458667541,29.156916],[120.30812252567536,29.164618407170384],[120.29985620690125,29.17070536401435],[120.287623,29.175804553087687],[120.2758096792694,29.170232065123994],[120.26638916134706,29.16489431489787],[120.25860777071031,29.156916],[120.26719947059442,29.14924214735437],[120.27533731267916,29.143067479656885],[120.287623,29.13803930776139],[120.29939304123624,29.14364871985175],[120.30894831097926,29.14890331566776]],"color":"#d68120"}],"branches":[{"name":"东阳吴宁西路","pos":[120.224112,29.264471],"sourceDistrict":"东阳市","address":"东阳市","distance":836,"inside":false,"nearestZone":"浙江东阳经济开发区"}]};const map=new AMap.Map("map",{center:cfg.center,zoom:11,viewMode:"2D",resizeEnable:true,scrollWheel:true,mapStyle:"amap://styles/normal"});map.addControl(new AMap.Scale());map.addControl(new AMap.ToolBar({position:{right:"18px",top:"88px"}}));const overlays=[],rows=[];document.getElementById("legend").innerHTML="<div><b>"+cfg.city+" · "+cfg.district+"</b></div><div class='section'>开发区（"+cfg.zones.length+"个）</div>"+cfg.zones.map(z=>"<div><span class='sw' style='background:"+z.color+"33;border-color:"+z.color+"'></span>"+z.name+"</div>").join("")+"<div class='section'>网点（"+cfg.branches.length+"个）</div>"+(cfg.branches.length?cfg.branches.map(b=>"<div>"+(b.external?"[同市外区] ":"")+b.name+"</div>").join(""):"<div>同市10公里内无可补充网点</div>")+"<div class='section'>绿色=区内；红色=本区区外；紫色=同市外区且距边界10公里内</div>";function foot(p,a,b){const lat=p.getLat()*Math.PI/180,kx=111320*Math.cos(lat),ky=110540,px=p.getLng()*kx,py=p.getLat()*ky,ax=a.getLng()*kx,ay=a.getLat()*ky,bx=b.getLng()*kx,by=b.getLat()*ky,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));return new AMap.LngLat((ax+t*dx)/kx,(ay+t*dy)/ky)}cfg.zones.forEach(z=>{z.poly=new AMap.Polygon({path:z.path,strokeColor:z.color,strokeWeight:4,fillColor:z.color,fillOpacity:.18,zIndex:40});map.add(z.poly);overlays.push(z.poly);const c=z.poly.getBounds().getCenter();map.add(new AMap.Marker({position:c,content:"<div class='zone-label' style='color:"+z.color+"'>"+z.name+"</div>",offset:new AMap.Pixel(-70,-14),zIndex:70}))});cfg.branches.forEach(b=>{const p=new AMap.LngLat(...b.pos);let insideZone=null,nearZone=null,min=Infinity,nearestPoint=null;for(const z of cfg.zones){const ring=z.poly.getPath();if(AMap.GeometryUtil.isPointInRing(p,ring))insideZone=z;for(let i=0;i<ring.length;i++){const distance=AMap.GeometryUtil.distanceToSegment(p,ring[i],ring[(i+1)%ring.length]);if(distance<min){min=distance;nearZone=z;nearestPoint=foot(p,ring[i],ring[(i+1)%ring.length])}}}const color=b.external?"#7546a8":(insideZone?"#23965b":"#d33b49"),distance=min<1000?Math.round(min)+"米":(min/1000).toFixed(2)+"公里";const marker=new AMap.Marker({position:p,content:"<div class='branch-dot' style='background:"+color+"'></div>",offset:new AMap.Pixel(-14,-14),zIndex:120,title:b.name});map.add(marker);overlays.push(marker);const status=b.external?"<b style='color:#7546a8'>同市外区</b> · 距"+nearZone.name+"边界 "+distance:(insideZone?"<b style='color:#23965b'>区内</b> · "+insideZone.name:"<b style='color:#d33b49'>区外</b> · 距"+nearZone.name+"边界 "+distance);rows.push("<b>"+b.name+"</b><br>"+status);if((b.external||!insideZone)&&nearestPoint){const line=new AMap.Polyline({path:[p,nearestPoint],strokeColor:color,strokeWeight:2,strokeOpacity:.55,strokeStyle:"dashed"});map.add(line);overlays.push(line)}});document.getElementById("result").innerHTML="<b>网点判定详情</b><br><br>"+(rows.join("<br><br>")||"暂无网点");if(overlays.length)map.setFitView(overlays,false,[90,90,90,90],12);</script></body></html>
